<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mark's Day Planner</title>
  <link rel="stylesheet" href="planner.css">
</head>

<body class="planner-page">

  <div class="top-bar">
    <button class="dark-toggle" id="darkToggle">🌙 Dark Mode</button>
  </div>

  <header class="header">
    <div class="greeting" id="greeting"></div>
    <div class="date" id="date"></div>
  </header>

  <!-- WORLD CLOCKS -->

  <div class="world-clocks">

    <div class="clock-card">
      <div class="clock-location">🇬🇧 London</div>
      <div class="clock-time" id="clock-london">--:--:--</div>
      <div class="clock-date" id="date-london"></div>
    </div>

    <div class="clock-card">
      <div class="clock-location">🇺🇸 New York</div>
      <div class="clock-time" id="clock-newyork">--:--:--</div>
      <div class="clock-date" id="date-newyork"></div>
    </div>

    <div class="clock-card">
      <div class="clock-location">🇺🇸 Chicago</div>
      <div class="clock-time" id="clock-chicago">--:--:--</div>
      <div class="clock-date" id="date-chicago"></div>
    </div>

    <div class="clock-card">
      <div class="clock-location">🇺🇸 Los Angeles</div>
      <div class="clock-time" id="clock-losangeles">--:--:--</div>
      <div class="clock-date" id="date-losangeles"></div>
    </div>

    <div class="clock-card">
      <div class="clock-location">🇫🇷 Paris</div>
      <div class="clock-time" id="clock-paris">--:--:--</div>
      <div class="clock-date" id="date-paris"></div>
    </div>

  </div>

  <div class="dashboard">

    <main class="main-column">

      <!-- TODAY'S PROGRESS -->

      <div class="progress-card">
        <div class="progress-header">
          <span>Today's Progress</span>
          <span id="progressText">0 / 0</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- ADD TASK -->

      <form class="add-task" id="taskForm">

        <input type="time" id="taskTime" required />

        <input
          type="text"
          id="taskText"
          placeholder="What do you need to do?"
          required
        />

        <select id="taskPriority">
          <option value="low">🟢 Low</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>

        <button type="submit">+ Add Task</button>

      </form>

      <!-- PLANNER -->

      <div class="planner" id="planner"></div>

      <div class="controls">
        <button class="reset-button" id="resetAll">
          Reset All Tasks
        </button>
      </div>

      <div class="celebrate" id="celebrate">
        ✅ All tasks done! You're on fire, Mark 🔥
      </div>

    </main>

    <!-- SEPTEMBER GOALS -->

    <aside class="goals-card">

      <div class="goals-title-row">
        <h2 class="goals-title">September Goals</h2>
        <span class="goals-year">2026</span>
      </div>

      <div class="goals-subtitle">
        Monthly objectives — keep these in sight all month.
      </div>

      <div class="goals-progress-header">
        <span>Progress</span>
        <span id="goalsProgressText">0 / 10</span>
      </div>

      <div class="goals-progress-bar">
        <div class="goals-progress-fill" id="goalsProgressFill"></div>
      </div>

      <div id="goalsList"></div>

      <div class="goals-complete" id="goalsComplete">
        🎉 September goals complete!
      </div>

    </aside>

  </div>

  <!-- UNDO -->

  <div class="undo" id="undo">
    <span>Task deleted</span>
    <button id="undoButton">Undo</button>
  </div>

  <script>

    const planner = document.getElementById("planner");
    const form = document.getElementById("taskForm");
    const taskTime = document.getElementById("taskTime");
    const taskText = document.getElementById("taskText");
    const taskPriority = document.getElementById("taskPriority");

    const celebrate = document.getElementById("celebrate");
    const resetAll = document.getElementById("resetAll");

    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");

    const greeting = document.getElementById("greeting");
    const date = document.getElementById("date");

    const darkToggle = document.getElementById("darkToggle");

    const undoBox = document.getElementById("undo");
    const undoButton = document.getElementById("undoButton");

    const goalsList = document.getElementById("goalsList");
    const goalsProgressFill = document.getElementById("goalsProgressFill");
    const goalsProgressText = document.getElementById("goalsProgressText");
    const goalsComplete = document.getElementById("goalsComplete");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    let deletedTask = null;
    let deletedIndex = null;
    let undoTimeout = null;

    /*
      =========================
      SEPTEMBER 2026 GOALS
      =========================
    */

    const septemberGoals = [
      {
        id: "nother-script",
        text: "Finish and LOCK the #NotHer script",
        category: "#NotHer"
      },
      {
        id: "nother-deck",
        text: "LOCK the #NotHer pitch deck + complete the full pitching package",
        category: "#NotHer"
      },
      {
        id: "nother-pitching",
        text: "Begin active #NotHer pitching — outreach, submissions and meetings",
        category: "#NotHer"
      },
      {
        id: "struggles-draft",
        text: "Complete the FIRST DRAFT of The Struggles of Others",
        category: "The Struggles of Others"
      },
      {
        id: "struggles-casting",
        text: "FINISH casting for The Struggles of Others",
        category: "The Struggles of Others"
      },
      {
        id: "pickup-guy",
        text: "FINISH the Pickup Guy story treatment + prepare for an early-development announcement",
        category: "Pickup Guy"
      },
      {
        id: "minotaur",
        text: "Develop The Minotaur from concept → full story outline + begin treatment",
        category: "The Minotaur"
      },
      {
        id: "talent-creators",
        text: "LAND at least ONE paid or credited opportunity for Majcherczyk Talent or Creators",
        category: "Talent / Creators"
      },
      {
        id: "producer",
        text: "Find and establish a relationship with ONE talented early-career producer for future Majcherczyk Digital projects",
        category: "Team / Partnerships"
      },
      {
        id: "george",
        text: "Bring George fully into the Majcherczyk Digital workflow as Head of Music, while giving him hands-on experience across production, casting, outreach, story development and Google Workspace",
        category: "Team / Development"
      }
    ];

    let completedGoals =
      JSON.parse(localStorage.getItem("septemberGoals2026")) || {};

    /*
      =========================
      GREETING + DATE
      =========================
    */

    function updateDate() {

      const now = new Date();
      const hour = now.getHours();

      let greetingText = "Good morning";

      if (hour >= 12 && hour < 18) {
        greetingText = "Good afternoon";
      } else if (hour >= 18) {
        greetingText = "Good evening";
      }

      greeting.textContent = `${greetingText}, Mark 👋`;

      date.textContent = now.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    updateDate();

    /*
      =========================
      WORLD CLOCKS
      =========================
    */

    const timeZones = {
      london: "Europe/London",
      newyork: "America/New_York",
      chicago: "America/Chicago",
      losangeles: "America/Los_Angeles",
      paris: "Europe/Paris"
    };

    function updateWorldClocks() {

      Object.entries(timeZones).forEach(([location, timeZone]) => {

        const now = new Date();

        const time = new Intl.DateTimeFormat("en-GB", {
          timeZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(now);

        const formattedDate = new Intl.DateTimeFormat("en-GB", {
          timeZone,
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric"
        }).format(now);

        document.getElementById(
          `clock-${location}`
        ).textContent = time;

        document.getElementById(
          `date-${location}`
        ).textContent = formattedDate;

      });
    }

    updateWorldClocks();

    setInterval(updateWorldClocks, 1000);
    setInterval(updateDate, 1000);

    /*
      =========================
      LOCAL STORAGE
      =========================
    */

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    /*
      =========================
      TODAY'S PROGRESS
      =========================
    */

    function updateProgress() {

      const total = tasks.length;
      const completed = tasks.filter(task => task.done).length;

      const percentage =
        total === 0
          ? 0
          : Math.round((completed / total) * 100);

      progressFill.style.width = `${percentage}%`;

      progressText.textContent =
        `${completed} / ${total} (${percentage}%)`;

      const allDone =
        total > 0 && completed === total;

      celebrate.classList.toggle("show", allDone);
    }

    /*
      =========================
      SEPTEMBER GOAL PROGRESS
      =========================
    */

    function saveGoals() {
      localStorage.setItem(
        "septemberGoals2026",
        JSON.stringify(completedGoals)
      );
    }

    function updateGoalsProgress() {

      const total = septemberGoals.length;

      const completed =
        septemberGoals.filter(goal =>
          completedGoals[goal.id]
        ).length;

      const percentage =
        Math.round((completed / total) * 100);

      goalsProgressFill.style.width =
        `${percentage}%`;

      goalsProgressText.textContent =
        `${completed} / ${total}`;

      goalsComplete.classList.toggle(
        "show",
        completed === total
      );
    }

    function renderGoals() {

      goalsList.innerHTML = "";

      septemberGoals.forEach(goal => {

        const goalElement =
          document.createElement("div");

        goalElement.className = "goal";

        if (completedGoals[goal.id]) {
          goalElement.classList.add("completed");
        }

        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.className = "goal-checkbox";
        checkbox.checked =
          !!completedGoals[goal.id];

        const label =
          document.createElement("label");

        label.className = "goal-label";

        label.innerHTML = `
          ${goal.text}
          <span class="goal-category">
            ${goal.category}
          </span>
        `;

        checkbox.addEventListener(
          "change",
          () => {

            completedGoals[goal.id] =
              checkbox.checked;

            saveGoals();

            renderGoals();

          }
        );

        goalElement.appendChild(checkbox);
        goalElement.appendChild(label);

        goalsList.appendChild(goalElement);

      });

      updateGoalsProgress();
    }

        function sortTasksByTime() {
      tasks.sort((a, b) => {
        return a.time.localeCompare(b.time);
      });
    
      saveTasks();
    }

    /*
      =========================
      RENDER TASKS
      =========================
    */

      function renderTasks() {

      sortTasksByTime();
    
      planner.innerHTML = "";

      tasks.forEach((task, index) => {

        const div =
          document.createElement("div");

        div.className = "task";
        

        if (task.done) {
          div.classList.add("done");
        }

       

        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        checkbox.addEventListener(
          "change",
          () => {

            task.done =
              checkbox.checked;

            saveTasks();
            renderTasks();

          }
        );

        const timeInput =
          document.createElement("input");

        timeInput.type = "time";
        timeInput.value = task.time;

        timeInput.addEventListener(
          "change",
          () => {
        
            task.time = timeInput.value;
        
            sortTasksByTime();
            renderTasks();
        
          }
        );

        const textInput =
          document.createElement("input");

        textInput.type = "text";
        textInput.value = task.text;

        textInput.addEventListener(
          "change",
          () => {

            task.text =
              textInput.value;

            saveTasks();

          }
        );

        const priority =
          document.createElement("select");

        priority.className =
          `priority ${task.priority || "medium"}`;

        priority.innerHTML = `
          <option value="low">🟢 Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🔴 High</option>
        `;

        priority.value =
          task.priority || "medium";

        priority.addEventListener(
          "change",
          () => {

            task.priority =
              priority.value;

            priority.className =
              `priority ${priority.value}`;

            saveTasks();

          }
        );

        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-task";

        deleteButton.textContent = "🗑️";
        deleteButton.title = "Delete task";

        deleteButton.addEventListener(
          "click",
          () => {

            deletedTask = task;
            deletedIndex = index;

            tasks.splice(index, 1);

            saveTasks();
            renderTasks();

            showUndo();

          }
        );

        div.appendChild(checkbox);
        div.appendChild(timeInput);
        div.appendChild(textInput);
        div.appendChild(priority);
        div.appendChild(deleteButton);

        

        planner.appendChild(div);

      });

      updateProgress();
    }

    /*
      
      =========================
      ADD TASK
      =========================
    */

    form.addEventListener(
      "submit",
      e => {

        e.preventDefault();

        tasks.push({
          time: taskTime.value,
          text: taskText.value,
          priority: taskPriority.value,
          done: false
        });

        saveTasks();
        renderTasks();

        taskTime.value = "";
        taskText.value = "";

        taskText.focus();

      }
    );

    /*
      =========================
      UNDO DELETE
      =========================
    */

    function showUndo() {

      undoBox.classList.add("show");

      clearTimeout(undoTimeout);

      undoTimeout =
        setTimeout(() => {

          undoBox.classList.remove("show");

          deletedTask = null;
          deletedIndex = null;

        }, 5000);
    }

    undoButton.addEventListener(
      "click",
      () => {

        if (deletedTask) {

          tasks.splice(
            deletedIndex,
            0,
            deletedTask
          );

          saveTasks();
          renderTasks();

          deletedTask = null;
          deletedIndex = null;

          clearTimeout(undoTimeout);

          undoBox.classList.remove("show");

        }

      }
    );

    /*
      =========================
      RESET ALL
      =========================
    */

    resetAll.addEventListener(
      "click",
      () => {

        if (
          confirm(
            "Are you sure you want to delete all tasks?"
          )
        ) {

          tasks = [];

          saveTasks();
          renderTasks();

        }

      }
    );

    /*
      =========================
      DARK MODE
      =========================
    */

    function updateDarkModeButton() {

      if (
        document.body.classList.contains("dark")
      ) {

        darkToggle.textContent =
          "☀️ Light Mode";

      } else {

        darkToggle.textContent =
          "🌙 Dark Mode";

      }

    }

    darkToggle.addEventListener(
      "click",
      () => {

        document.body.classList.toggle("dark");

        const isDark =
          document.body.classList.contains("dark");

        localStorage.setItem(
          "darkMode",
          isDark ? "true" : "false"
        );

        updateDarkModeButton();

      }
    );

    if (
      localStorage.getItem("darkMode") === "true"
    ) {

      document.body.classList.add("dark");

    }

    updateDarkModeButton();

    /*
      =========================
      START
      =========================
    */

    renderTasks();
    renderGoals();

  </script>

</body>
</html>

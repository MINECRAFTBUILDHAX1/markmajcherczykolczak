<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mark's Day Planner</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #222;
      --muted: #777;
      --accent: #4f46e5;
      --border: #e5e5e5;
      --done-bg: #e8f8e8;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --rounded: 16px;
    }

    body.dark {
      --bg: #111114;
      --card: #1c1c21;
      --text: #f5f5f5;
      --muted: #999;
      --border: #33333a;
      --done-bg: #19351f;
      --shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .top-bar,
    .header,
    .world-clocks {
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    .top-bar {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: flex-end;
    }

    .dark-toggle {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 50px;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      font-size: 1rem;
    }

    .header {
      margin-bottom: 1.5rem;
    }

    .greeting {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .date {
      color: var(--muted);
      font-size: 1rem;
    }

    .world-clocks {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.7rem;
      margin-bottom: 1.5rem;
    }

    .clock-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.85rem 0.7rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .clock-location {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .clock-time {
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .clock-date {
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 0.25rem;
    }

    .dashboard {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 1.5rem;
      align-items: start;
    }

    .main-column {
      min-width: 0;
    }

    .progress-card {
      background: var(--card);
      padding: 1.2rem;
      border-radius: var(--rounded);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.7rem;
      font-weight: 600;
    }

    .progress-bar {
      height: 12px;
      background: var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .add-task {
      display: grid;
      grid-template-columns: 110px 1fr 145px 120px;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .add-task input,
    .add-task select,
    .add-task button {
      padding: 0.7rem;
      font-size: 1rem;
      border-radius: 12px;
    }

    .add-task input,
    .add-task select {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }

    .add-task button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .planner {
      background: var(--card);
      border-radius: var(--rounded);
      padding: 1.2rem;
      box-shadow: var(--shadow);
    }

    .task {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: grab;
      transition: 0.2s;
    }

    .task:active {
      cursor: grabbing;
    }

    .task.dragging {
      opacity: 0.4;
    }

    .task.done {
      background: var(--done-bg);
    }

    .drag-handle {
      color: var(--muted);
      font-size: 1.1rem;
      cursor: grab;
    }

    .task input[type="checkbox"] {
      transform: scale(1.3);
      accent-color: var(--accent);
    }

    .task input[type="time"] {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
    }

    .task input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.45rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }

    .priority {
      width: 125px;
      min-width: 125px;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 0.65rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .priority.low {
      background: #dcfce7;
      color: #166534;
    }

    .priority.medium {
      background: #fef3c7;
      color: #92400e;
    }

    .priority.high {
      background: #fee2e2;
      color: #991b1b;
    }

    .delete-task {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.3rem;
    }

    .controls {
      margin: 1.2rem auto;
      display: flex;
      justify-content: center;
    }

    .reset-button {
      background: var(--danger);
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .celebrate {
      text-align: center;
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #22c55e;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .celebrate.show {
      opacity: 1;
    }

    /* =========================
       SEPTEMBER GOALS
    ========================= */

    .goals-card {
      background: var(--card);
      border-radius: var(--rounded);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      position: sticky;
      top: 1.5rem;
    }

    .goals-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.25rem;
    }

    .goals-title {
      margin: 0;
      font-size: 1.35rem;
    }

    .goals-year {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .goals-subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .goals-progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
    }

    .goals-progress-bar {
      height: 9px;
      background: var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .goals-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .goal {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .goal:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .goal-checkbox {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
      flex-shrink: 0;
      cursor: pointer;
    }

    .goal-label {
      font-size: 0.9rem;
      line-height: 1.35;
      cursor: pointer;
    }

    .goal.completed .goal-label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .goal-category {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 0.2rem;
    }

    .goals-complete {
      text-align: center;
      color: #22c55e;
      font-weight: 700;
      margin-top: 1rem;
      display: none;
    }

    .goals-complete.show {
      display: block;
    }

    .undo {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      display: none;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      z-index: 10;
    }

    .undo.show {
      display: flex;
    }

    .undo button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    @media (max-width: 900px) {
      body {
        padding: 1rem;
      }

      .dashboard {
        grid-template-columns: 1fr;
      }

      .goals-card {
        position: static;
      }

      .world-clocks {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .greeting {
        font-size: 1.6rem;
      }

      .world-clocks {
        grid-template-columns: repeat(2, 1fr);
      }

      .add-task {
        grid-template-columns: 1fr;
      }

      .task {
        flex-wrap: wrap;
      }

      .task input[type="text"] {
        width: 100%;
        order: 5;
      }

      .priority {
        width: 125px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <button class="dark-toggle" id="darkToggle">🌙 Dark Mode</button>
  </div>

  <header class="header">
    <div class="greeting" id="greeting"></div>
    <div class="date" id="date"></div>
  </header>

  <!-- WORLD CLOCKS -->

  <div class="world-clocks">

    <div class="clock-card">
      <div class="clock-location">🇬🇧 London</div>
      <div class="clock-time" id="clock-london">--:--:--</div>
      <div class="clock-date" id="date-london"></div>
    </div>

    <div class="clock-card">
      <div class="clock-location">🇺🇸 New York</div>
      <div class="clock-time" id="clock-newyork">--:--:--</div>
      <div class="clock-date" id="date-newyork"></div>
    </div>

    <div class="clock-card">
      <div class="clock-location">🇺🇸 Chicago</div>
      <div class="clock-time" id="clock-chicago">--:--:--</div>
      <div class="clock-date" id="date-chicago"></div>
    </div>

    <div class="clock-card">
      <div class="clock-location">🇺🇸 Los Angeles</div>
      <div class="clock-time" id="clock-losangeles">--:--:--</div>
      <div class="clock-date" id="date-losangeles"></div>
    </div>

    <div class="clock-card">
      <div class="clock-location">🇫🇷 Paris</div>
      <div class="clock-time" id="clock-paris">--:--:--</div>
      <div class="clock-date" id="date-paris"></div>
    </div>

  </div>

  <div class="dashboard">

    <main class="main-column">

      <!-- TODAY'S PROGRESS -->

      <div class="progress-card">
        <div class="progress-header">
          <span>Today's Progress</span>
          <span id="progressText">0 / 0</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- ADD TASK -->

      <form class="add-task" id="taskForm">

        <input type="time" id="taskTime" required />

        <input
          type="text"
          id="taskText"
          placeholder="What do you need to do?"
          required
        />

        <select id="taskPriority">
          <option value="low">🟢 Low</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>

        <button type="submit">+ Add Task</button>

      </form>

      <!-- PLANNER -->

      <div class="planner" id="planner"></div>

      <div class="controls">
        <button class="reset-button" id="resetAll">
          Reset All Tasks
        </button>
      </div>

      <div class="celebrate" id="celebrate">
        ✅ All tasks done! You're on fire, Mark 🔥
      </div>

    </main>

    <!-- SEPTEMBER GOALS -->

    <aside class="goals-card">

      <div class="goals-title-row">
        <h2 class="goals-title">September Goals</h2>
        <span class="goals-year">2026</span>
      </div>

      <div class="goals-subtitle">
        Monthly objectives — keep these in sight all month.
      </div>

      <div class="goals-progress-header">
        <span>Progress</span>
        <span id="goalsProgressText">0 / 10</span>
      </div>

      <div class="goals-progress-bar">
        <div class="goals-progress-fill" id="goalsProgressFill"></div>
      </div>

      <div id="goalsList"></div>

      <div class="goals-complete" id="goalsComplete">
        🎉 September goals complete!
      </div>

    </aside>

  </div>

  <!-- UNDO -->

  <div class="undo" id="undo">
    <span>Task deleted</span>
    <button id="undoButton">Undo</button>
  </div>

  <script>

    const planner = document.getElementById("planner");
    const form = document.getElementById("taskForm");
    const taskTime = document.getElementById("taskTime");
    const taskText = document.getElementById("taskText");
    const taskPriority = document.getElementById("taskPriority");

    const celebrate = document.getElementById("celebrate");
    const resetAll = document.getElementById("resetAll");

    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");

    const greeting = document.getElementById("greeting");
    const date = document.getElementById("date");

    const darkToggle = document.getElementById("darkToggle");

    const undoBox = document.getElementById("undo");
    const undoButton = document.getElementById("undoButton");

    const goalsList = document.getElementById("goalsList");
    const goalsProgressFill = document.getElementById("goalsProgressFill");
    const goalsProgressText = document.getElementById("goalsProgressText");
    const goalsComplete = document.getElementById("goalsComplete");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    let deletedTask = null;
    let deletedIndex = null;
    let undoTimeout = null;

    /*
      =========================
      SEPTEMBER 2026 GOALS
      =========================
    */

    const septemberGoals = [
      {
        id: "nother-script",
        text: "Finish and lock #NotHer script",
        category: "#NotHer"
      },
      {
        id: "nother-deck",
        text: "Lock #NotHer pitch deck",
        category: "#NotHer"
      },
      {
        id: "nother-pitching",
        text: "Start pitching #NotHer",
        category: "#NotHer"
      },
      {
        id: "struggles-draft",
        text: "Start The Struggles of Others first draft",
        category: "The Struggles of Others"
      },
      {
        id: "struggles-casting",
        text: "Finish casting for The Struggles of Others",
        category: "The Struggles of Others"
      },
      {
        id: "pickup-guy",
        text: "Finish Pickup Guy story treatment",
        category: "Pickup Guy"
      },
      {
        id: "minotaur",
        text: "Start The Minotaur — story outline and possibly treatment",
        category: "The Minotaur"
      },
      {
        id: "talent-creators",
        text: "Land one role for Talent or Creators",
        category: "Talent / Creators"
      },
      {
        id: "producer",
        text: "Connect with a talented early-career producer to partner with",
        category: "Team / Partnerships"
      },
      {
        id: "george",
        text: "Get George more involved in production, outreach, stories and Google Suite",
        category: "Team / Development"
      }
    ];

    let completedGoals =
      JSON.parse(localStorage.getItem("septemberGoals2026")) || {};

    /*
      =========================
      GREETING + DATE
      =========================
    */

    function updateDate() {

      const now = new Date();
      const hour = now.getHours();

      let greetingText = "Good morning";

      if (hour >= 12 && hour < 18) {
        greetingText = "Good afternoon";
      } else if (hour >= 18) {
        greetingText = "Good evening";
      }

      greeting.textContent = `${greetingText}, Mark 👋`;

      date.textContent = now.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    updateDate();

    /*
      =========================
      WORLD CLOCKS
      =========================
    */

    const timeZones = {
      london: "Europe/London",
      newyork: "America/New_York",
      chicago: "America/Chicago",
      losangeles: "America/Los_Angeles",
      paris: "Europe/Paris"
    };

    function updateWorldClocks() {

      Object.entries(timeZones).forEach(([location, timeZone]) => {

        const now = new Date();

        const time = new Intl.DateTimeFormat("en-GB", {
          timeZone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(now);

        const formattedDate = new Intl.DateTimeFormat("en-GB", {
          timeZone,
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric"
        }).format(now);

        document.getElementById(
          `clock-${location}`
        ).textContent = time;

        document.getElementById(
          `date-${location}`
        ).textContent = formattedDate;

      });
    }

    updateWorldClocks();

    setInterval(updateWorldClocks, 1000);
    setInterval(updateDate, 1000);

    /*
      =========================
      LOCAL STORAGE
      =========================
    */

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    /*
      =========================
      TODAY'S PROGRESS
      =========================
    */

    function updateProgress() {

      const total = tasks.length;
      const completed = tasks.filter(task => task.done).length;

      const percentage =
        total === 0
          ? 0
          : Math.round((completed / total) * 100);

      progressFill.style.width = `${percentage}%`;

      progressText.textContent =
        `${completed} / ${total} (${percentage}%)`;

      const allDone =
        total > 0 && completed === total;

      celebrate.classList.toggle("show", allDone);
    }

    /*
      =========================
      SEPTEMBER GOAL PROGRESS
      =========================
    */

    function saveGoals() {
      localStorage.setItem(
        "septemberGoals2026",
        JSON.stringify(completedGoals)
      );
    }

    function updateGoalsProgress() {

      const total = septemberGoals.length;

      const completed =
        septemberGoals.filter(goal =>
          completedGoals[goal.id]
        ).length;

      const percentage =
        Math.round((completed / total) * 100);

      goalsProgressFill.style.width =
        `${percentage}%`;

      goalsProgressText.textContent =
        `${completed} / ${total}`;

      goalsComplete.classList.toggle(
        "show",
        completed === total
      );
    }

    function renderGoals() {

      goalsList.innerHTML = "";

      septemberGoals.forEach(goal => {

        const goalElement =
          document.createElement("div");

        goalElement.className = "goal";

        if (completedGoals[goal.id]) {
          goalElement.classList.add("completed");
        }

        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.className = "goal-checkbox";
        checkbox.checked =
          !!completedGoals[goal.id];

        const label =
          document.createElement("label");

        label.className = "goal-label";

        label.innerHTML = `
          ${goal.text}
          <span class="goal-category">
            ${goal.category}
          </span>
        `;

        checkbox.addEventListener(
          "change",
          () => {

            completedGoals[goal.id] =
              checkbox.checked;

            saveGoals();

            renderGoals();

          }
        );

        goalElement.appendChild(checkbox);
        goalElement.appendChild(label);

        goalsList.appendChild(goalElement);

      });

      updateGoalsProgress();
    }

    /*
      =========================
      RENDER TASKS
      =========================
    */

    function renderTasks() {

      planner.innerHTML = "";

      tasks.forEach((task, index) => {

        const div =
          document.createElement("div");

        div.className = "task";
        div.draggable = true;
        div.dataset.index = index;

        if (task.done) {
          div.classList.add("done");
        }

        const handle =
          document.createElement("span");

        handle.className =
          "drag-handle";

        handle.textContent = "☷";

        const checkbox =
          document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        checkbox.addEventListener(
          "change",
          () => {

            task.done =
              checkbox.checked;

            saveTasks();
            renderTasks();

          }
        );

        const timeInput =
          document.createElement("input");

        timeInput.type = "time";
        timeInput.value = task.time;

        timeInput.addEventListener(
          "change",
          () => {

            task.time =
              timeInput.value;

            saveTasks();

          }
        );

        const textInput =
          document.createElement("input");

        textInput.type = "text";
        textInput.value = task.text;

        textInput.addEventListener(
          "change",
          () => {

            task.text =
              textInput.value;

            saveTasks();

          }
        );

        const priority =
          document.createElement("select");

        priority.className =
          `priority ${task.priority || "medium"}`;

        priority.innerHTML = `
          <option value="low">🟢 Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🔴 High</option>
        `;

        priority.value =
          task.priority || "medium";

        priority.addEventListener(
          "change",
          () => {

            task.priority =
              priority.value;

            priority.className =
              `priority ${priority.value}`;

            saveTasks();

          }
        );

        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-task";

        deleteButton.textContent = "🗑️";
        deleteButton.title = "Delete task";

        deleteButton.addEventListener(
          "click",
          () => {

            deletedTask = task;
            deletedIndex = index;

            tasks.splice(index, 1);

            saveTasks();
            renderTasks();

            showUndo();

          }
        );

        div.appendChild(handle);
        div.appendChild(checkbox);
        div.appendChild(timeInput);
        div.appendChild(textInput);
        div.appendChild(priority);
        div.appendChild(deleteButton);

        div.addEventListener(
          "dragstart",
          () => {
            div.classList.add("dragging");
          }
        );

        div.addEventListener(
          "dragend",
          () => {
            div.classList.remove("dragging");
          }
        );

        planner.appendChild(div);

      });

      setupDragAndDrop();
      updateProgress();
    }

    /*
      =========================
      DRAG & DROP
      =========================
    */

    function setupDragAndDrop() {

      const taskElements =
        document.querySelectorAll(".task");

      taskElements.forEach(taskElement => {

        taskElement.addEventListener(
          "dragover",
          e => {

            e.preventDefault();

            const dragging =
              document.querySelector(".dragging");

            if (
              !dragging ||
              dragging === taskElement
            ) {
              return;
            }

            const rect =
              taskElement.getBoundingClientRect();

            const midpoint =
              rect.top + rect.height / 2;

            if (e.clientY < midpoint) {

              planner.insertBefore(
                dragging,
                taskElement
              );

            } else {

              planner.insertBefore(
                dragging,
                taskElement.nextSibling
              );

            }

          }
        );

        taskElement.addEventListener(
          "drop",
          e => {

            e.preventDefault();

            const newOrder = [];

            document
              .querySelectorAll(".task")
              .forEach(element => {

                const oldIndex =
                  Number(element.dataset.index);

                newOrder.push(tasks[oldIndex]);

              });

            tasks = newOrder;

            saveTasks();
            renderTasks();

          }
        );

      });
    }

    /*
      =========================
      ADD TASK
      =========================
    */

    form.addEventListener(
      "submit",
      e => {

        e.preventDefault();

        tasks.push({
          time: taskTime.value,
          text: taskText.value,
          priority: taskPriority.value,
          done: false
        });

        saveTasks();
        renderTasks();

        taskTime.value = "";
        taskText.value = "";

        taskText.focus();

      }
    );

    /*
      =========================
      UNDO DELETE
      =========================
    */

    function showUndo() {

      undoBox.classList.add("show");

      clearTimeout(undoTimeout);

      undoTimeout =
        setTimeout(() => {

          undoBox.classList.remove("show");

          deletedTask = null;
          deletedIndex = null;

        }, 5000);
    }

    undoButton.addEventListener(
      "click",
      () => {

        if (deletedTask) {

          tasks.splice(
            deletedIndex,
            0,
            deletedTask
          );

          saveTasks();
          renderTasks();

          deletedTask = null;
          deletedIndex = null;

          clearTimeout(undoTimeout);

          undoBox.classList.remove("show");

        }

      }
    );

    /*
      =========================
      RESET ALL
      =========================
    */

    resetAll.addEventListener(
      "click",
      () => {

        if (
          confirm(
            "Are you sure you want to delete all tasks?"
          )
        ) {

          tasks = [];

          saveTasks();
          renderTasks();

        }

      }
    );

    /*
      =========================
      DARK MODE
      =========================
    */

    function updateDarkModeButton() {

      if (
        document.body.classList.contains("dark")
      ) {

        darkToggle.textContent =
          "☀️ Light Mode";

      } else {

        darkToggle.textContent =
          "🌙 Dark Mode";

      }

    }

    darkToggle.addEventListener(
      "click",
      () => {

        document.body.classList.toggle("dark");

        const isDark =
          document.body.classList.contains("dark");

        localStorage.setItem(
          "darkMode",
          isDark ? "true" : "false"
        );

        updateDarkModeButton();

      }
    );

    if (
      localStorage.getItem("darkMode") === "true"
    ) {

      document.body.classList.add("dark");

    }

    updateDarkModeButton();

    /*
      =========================
      START
      =========================
    */

    renderTasks();
    renderGoals();

  </script>

</body>
</html>

  <style>
    :root {
      --black: #050505;
      --white: #f5f5f3;
      --muted: #a4a4a0;
      --line: rgba(245, 245, 243, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      background: var(--black);
    }

    body {
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: "DM Sans", Arial, sans-serif;
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* MAIN */

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main {
      flex: 1;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 42px 48px 28px;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .logo {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .location {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* HERO */

    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;
      gap: 80px;
      padding: 35px 0 20px;
    }

    .hero-content {
      max-width: 600px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(3.5rem, 6.2vw, 6.6rem);
      font-weight: 500;
      line-height: 0.94;
      letter-spacing: -0.045em;
      max-width: 700px;
    }

    .role {
      margin-top: 28px;
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      line-height: 1.5;
      color: var(--muted);
      max-width: 470px;
    }

    .role strong {
      color: var(--white);
      font-weight: 500;
    }

    /* NAVIGATION */

    .navigation {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-top: 42px;
    }

    .navigation a {
      position: relative;
      font-size: 0.72rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      padding-bottom: 5px;
    }

    .navigation a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background: var(--white);
      transition: width 0.25s ease;
    }

    .navigation a:hover::after,
    .navigation a:focus-visible::after {
      width: 100%;
    }

    /* PHOTO */

  
    .portrait {
      position: relative;
      justify-self: end;
      width: min(430px, 100%);
      aspect-ratio: 4 / 5;
      overflow: visible;
    }
    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%);
    }

    /* BOTTOM */

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    .socials {
      display: flex;
      gap: 22px;
    }

    .socials a,
    .contact {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .socials a:hover,
    .contact:hover {
      color: var(--white);
    }

    .footer {
      font-size: 0.65rem;
      color: #686864;
      letter-spacing: 0.05em;
    }

    /* TABLET */

    @media (max-width: 800px) {
      body {
        overflow: auto;
      }

      .main {
        min-height: 100vh;
        padding: 30px 28px 24px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 38px;
        padding: 55px 0 35px;
      }

      .portrait {
        justify-self: start;
        width: min(330px, 70vw);
      }

      .bottom {
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
      }
    }

    /* MOBILE */

    @media (max-width: 520px) {
      .main {
        padding: 24px 20px 20px;
      }

      .header {

      }

      .location {

      }

      .hero {
        gap: 30px;
        padding: 48px 0 32px;
      }

      .eyebrow {
        margin-bottom: 17px;
      }

      .name {
        font-size: clamp(3rem, 14vw, 4.4rem);
      }

      .role {
        margin-top: 22px;
        font-size: 0.95rem;
      }

      .navigation {
        gap: 12px 20px;
        margin-top: 30px;
      }

      .portrait {
        width: min(290px, 76vw);
      }

      .socials {
        flex-wrap: wrap;
        gap: 15px 20px;
      }

      .bottom {
        padding-top: 15px;
      }
    }


          /* EDITORIAL PHOTO TAPE */
      
      .portrait {
        position: relative;
      }
      
  
      .photo-tape {
        position: absolute;
        width: 115px;
        height: 28px;
        background: rgba(235, 233, 224, 0.9);
        top: 18px;
        right: -38px;
        transform: rotate(50deg);
        transform-origin: center;
        z-index: 3;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      }
      /* Slightly softer tape edges */
      
      .photo-tape::before,
      .photo-tape::after {
        content: "";
        position: absolute;
        top: 0;
        width: 7px;
        height: 100%;
        background: rgba(220, 218, 208, 0.45);
      }
      
      .photo-tape::before {
        left: 0;
      }
      
      .photo-tape::after {
        right: 0;
      }
      
      /* MOBILE */
      
      @media (max-width: 520px) {
        .photo-tape {
          width: 85px;
          height: 21px;
          top: 13px;
          right: -20px;
        }

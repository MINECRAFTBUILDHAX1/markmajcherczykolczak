<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mark's Day Planner</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #222;
      --muted: #777;
      --accent: #4f46e5;
      --border: #e5e5e5;
      --done-bg: #e8f8e8;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --rounded: 16px;
    }

    body.dark {
      --bg: #111114;
      --card: #1c1c21;
      --text: #f5f5f5;
      --muted: #999;
      --border: #33333a;
      --done-bg: #19351f;
      --shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .top-bar {
      max-width: 700px;
      margin: 0 auto 1.5rem;
      display: flex;
      justify-content: flex-end;
    }

    .dark-toggle {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 50px;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      font-size: 1rem;
    }

    .header {
      max-width: 700px;
      margin: 0 auto 1.5rem;
    }

    .greeting {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .date {
      color: var(--muted);
      font-size: 1rem;
    }

    .weather {
      margin-top: 0.8rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .progress-card {
      max-width: 700px;
      margin: 0 auto 1.5rem;
      background: var(--card);
      padding: 1.2rem;
      border-radius: var(--rounded);
      box-shadow: var(--shadow);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.7rem;
      font-weight: 600;
    }

    .progress-bar {
      height: 12px;
      background: var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .add-task {
      display: grid;
      grid-template-columns: 110px 1fr 120px;
      gap: 0.6rem;
      max-width: 700px;
      margin: 0 auto 1.5rem;
    }

    .add-task input,
    .add-task select,
    .add-task button {
      padding: 0.7rem;
      font-size: 1rem;
      border-radius: 12px;
    }

    .add-task input,
    .add-task select {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }

    .add-task button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .planner {
      max-width: 700px;
      margin: auto;
      background: var(--card);
      border-radius: var(--rounded);
      padding: 1.2rem;
      box-shadow: var(--shadow);
    }

    .task {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem;
      margin-bottom: 0.6rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: grab;
      transition: 0.2s;
    }

    .task:active {
      cursor: grabbing;
    }

    .task.dragging {
      opacity: 0.4;
    }

    .task.done {
      background: var(--done-bg);
    }

    .drag-handle {
      color: var(--muted);
      font-size: 1.1rem;
      cursor: grab;
    }

    .task input[type="checkbox"] {
      transform: scale(1.3);
      accent-color: var(--accent);
    }

    .task input[type="time"] {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
    }

    .task input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.45rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
    }

    .priority {
      border: none;
      border-radius: 8px;
      padding: 0.4rem;
      font-weight: 600;
      cursor: pointer;
    }

    .priority.low {
      background: #dcfce7;
      color: #166534;
    }

    .priority.medium {
      background: #fef3c7;
      color: #92400e;
    }

    .priority.high {
      background: #fee2e2;
      color: #991b1b;
    }

    .delete-task {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.3rem;
    }

    .controls {
      max-width: 700px;
      margin: 1.2rem auto;
      display: flex;
      justify-content: center;
    }

    .reset-button {
      background: var(--danger);
      color: white;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .undo {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      display: none;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .undo.show {
      display: flex;
    }

    .undo button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .celebrate {
      text-align: center;
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #22c55e;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .celebrate.show {
      opacity: 1;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .greeting {
        font-size: 1.6rem;
      }

      .add-task {
        grid-template-columns: 1fr;
      }

      .task {
        flex-wrap: wrap;
      }

      .task input[type="text"] {
        width: 100%;
        order: 5;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <button class="dark-toggle" id="darkToggle">🌙 Dark Mode</button>
  </div>

  <header class="header">
    <div class="greeting" id="greeting"></div>
    <div class="date" id="date"></div>
    <div class="weather" id="weather">🌤️ Loading weather...</div>
  </header>

  <div class="progress-card">
    <div class="progress-header">
      <span>Today's Progress</span>
      <span id="progressText">0 / 0</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <form class="add-task" id="taskForm">
    <input type="time" id="taskTime" required />

    <input
      type="text"
      id="taskText"
      placeholder="What do you need to do?"
      required
    />

    <select id="taskPriority">
      <option value="low">🟢 Low</option>
      <option value="medium" selected>🟡 Medium</option>
      <option value="high">🔴 High</option>
    </select>

    <button type="submit">+ Add Task</button>
  </form>

  <div class="planner" id="planner"></div>

  <div class="controls">
    <button class="reset-button" id="resetAll">
      Reset All Tasks
    </button>
  </div>

  <div class="celebrate" id="celebrate">
    ✅ All tasks done! You're on fire, Mark 🔥
  </div>

  <div class="undo" id="undo">
    <span>Task deleted</span>
    <button id="undoButton">Undo</button>
  </div>

  <script>
    const planner = document.getElementById("planner");
    const form = document.getElementById("taskForm");
    const taskTime = document.getElementById("taskTime");
    const taskText = document.getElementById("taskText");
    const taskPriority = document.getElementById("taskPriority");

    const celebrate = document.getElementById("celebrate");
    const resetAll = document.getElementById("resetAll");

    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");

    const greeting = document.getElementById("greeting");
    const date = document.getElementById("date");
    const weather = document.getElementById("weather");

    const darkToggle = document.getElementById("darkToggle");

    const undoBox = document.getElementById("undo");
    const undoButton = document.getElementById("undoButton");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let deletedTask = null;
    let deletedIndex = null;
    let undoTimeout = null;

    /* =========================
       GREETING + DATE
    ========================= */

    function updateDate() {
      const now = new Date();
      const hour = now.getHours();

      let greetingText = "Good morning";

      if (hour >= 12 && hour < 18) {
        greetingText = "Good afternoon";
      } else if (hour >= 18) {
        greetingText = "Good evening";
      }

      greeting.textContent = `${greetingText}, Mark 👋`;

      date.textContent = now.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    updateDate();

    /* =========================
       WEATHER
    ========================= */

    async function loadWeather() {
      if (!navigator.geolocation) {
        weather.textContent = "🌤️ Weather unavailable";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          try {
            const response = await fetch(
              `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`
            );

            const data = await response.json();

            const temp = Math.round(data.current.temperature_2m);
            const code = data.current.weather_code;

            weather.textContent =
              `${getWeatherEmoji(code)} ${getWeatherDescription(code)} • ${temp}°C`;
          } catch (error) {
            weather.textContent = "🌤️ Weather unavailable";
          }
        },
        () => {
          weather.textContent = "🌤️ Allow location for weather";
        }
      );
    }

    function getWeatherEmoji(code) {
      if (code === 0) return "☀️";
      if ([1, 2, 3].includes(code)) return "🌤️";
      if ([45, 48].includes(code)) return "🌫️";
      if ([51, 53, 55, 56, 57].includes(code)) return "🌦️";
      if ([61, 63, 65, 66, 67].includes(code)) return "🌧️";
      if ([71, 73, 75, 77].includes(code)) return "❄️";
      if ([80, 81, 82].includes(code)) return "🌦️";
      if ([95, 96, 99].includes(code)) return "⛈️";

      return "🌤️";
    }

    function getWeatherDescription(code) {
      if (code === 0) return "Clear";
      if ([1, 2, 3].includes(code)) return "Partly cloudy";
      if ([45, 48].includes(code)) return "Foggy";
      if ([51, 53, 55].includes(code)) return "Drizzle";
      if ([61, 63, 65].includes(code)) return "Rain";
      if ([71, 73, 75, 77].includes(code)) return "Snow";
      if ([80, 81, 82].includes(code)) return "Showers";
      if ([95, 96, 99].includes(code)) return "Thunderstorms";

      return "Weather";
    }

    loadWeather();

    /* =========================
       LOCAL STORAGE
    ========================= */

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    /* =========================
       PROGRESS
    ========================= */

    function updateProgress() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.done).length;

      const percentage =
        total === 0 ? 0 : Math.round((completed / total) * 100);

      progressFill.style.width = `${percentage}%`;
      progressText.textContent = `${completed} / ${total} (${percentage}%)`;

      const allDone = total > 0 && completed === total;

      celebrate.classList.toggle("show", allDone);
    }

    /* =========================
       RENDER
    ========================= */

    function renderTasks() {
      planner.innerHTML = "";

      tasks.forEach((task, index) => {

        const div = document.createElement("div");

        div.className = "task";
        div.draggable = true;
        div.dataset.index = index;

        if (task.done) {
          div.classList.add("done");
        }

        /* Drag handle */

        const handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "☷";

        /* Checkbox */

        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        /* Time */

        const timeInput = document.createElement("input");

        timeInput.type = "time";
        timeInput.value = task.time;

        timeInput.addEventListener("change", () => {
          task.time = timeInput.value;
          saveTasks();
        });

        /* Text */

        const textInput = document.createElement("input");

        textInput.type = "text";
        textInput.value = task.text;

        textInput.addEventListener("change", () => {
          task.text = textInput.value;
          saveTasks();
        });

        /* Priority */

        const priority = document.createElement("select");

        priority.className = `priority ${task.priority || "medium"}`;

        priority.innerHTML = `
          <option value="low">🟢 Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🔴 High</option>
        `;

        priority.value = task.priority || "medium";

        priority.addEventListener("change", () => {
          task.priority = priority.value;

          priority.className =
            `priority ${priority.value}`;

          saveTasks();
        });

        /* Delete */

        const deleteButton = document.createElement("button");

        deleteButton.className = "delete-task";
        deleteButton.textContent = "🗑️";
        deleteButton.title = "Delete task";

        deleteButton.addEventListener("click", () => {

          deletedTask = task;
          deletedIndex = index;

          tasks.splice(index, 1);

          saveTasks();
          renderTasks();

          showUndo();
        });

        div.appendChild(handle);
        div.appendChild(checkbox);
        div.appendChild(timeInput);
        div.appendChild(textInput);
        div.appendChild(priority);
        div.appendChild(deleteButton);

        /* Drag events */

        div.addEventListener("dragstart", () => {
          div.classList.add("dragging");
        });

        div.addEventListener("dragend", () => {
          div.classList.remove("dragging");
        });

        planner.appendChild(div);
      });

      setupDragAndDrop();
      updateProgress();
    }

    /* =========================
       DRAG & DROP
    ========================= */

    function setupDragAndDrop() {

      const taskElements =
        document.querySelectorAll(".task");

      taskElements.forEach(taskElement => {

        taskElement.addEventListener("dragover", e => {
          e.preventDefault();

          const dragging =
            document.querySelector(".dragging");

          if (!dragging || dragging === taskElement) return;

          const rect =
            taskElement.getBoundingClientRect();

          const midpoint =
            rect.top + rect.height / 2;

          if (e.clientY < midpoint) {
            planner.insertBefore(
              dragging,
              taskElement
            );
          } else {
            planner.insertBefore(
              dragging,
              taskElement.nextSibling
            );
          }
        });

        taskElement.addEventListener("drop", e => {
          e.preventDefault();

          const newOrder = [];

          document
            .querySelectorAll(".task")
            .forEach(element => {
              const oldIndex =
                Number(element.dataset.index);

              newOrder.push(tasks[oldIndex]);
            });

          tasks = newOrder;

          saveTasks();
          renderTasks();
        });
      });
    }

    /* =========================
       ADD TASK
    ========================= */

    form.addEventListener("submit", e => {

      e.preventDefault();

      tasks.push({
        time: taskTime.value,
        text: taskText.value,
        priority: taskPriority.value,
        done: false
      });

      saveTasks();
      renderTasks();

      taskTime.value = "";
      taskText.value = "";

      taskText.focus();
    });

    /* =========================
       UNDO DELETE
    ========================= */

    function showUndo() {

      undoBox.classList.add("show");

      clearTimeout(undoTimeout);

      undoTimeout = setTimeout(() => {
        undoBox.classList.remove("show");
        deletedTask = null;
        deletedIndex = null;
      }, 5000);
    }

    undoButton.addEventListener("click", () => {

      if (deletedTask) {

        tasks.splice(
          deletedIndex,
          0,
          deletedTask
        );

        saveTasks();
        renderTasks();

        deletedTask = null;
        deletedIndex = null;

        clearTimeout(undoTimeout);
        undoBox.classList.remove("show");
      }
    });

    /* =========================
       RESET ALL
    ========================= */

    resetAll.addEventListener("click", () => {

      if (
        confirm(
          "Are you sure you want to delete all tasks?"
        )
      ) {
        tasks = [];

        saveTasks();
        renderTasks();
      }
    });

    /* =========================
       DARK MODE
    ========================= */

    function updateDarkModeButton() {

      if (document.body.classList.contains("dark")) {
        darkToggle.textContent = "☀️ Light Mode";
      } else {
        darkToggle.textContent = "🌙 Dark Mode";
      }
    }

    darkToggle.addEventListener("click", () => {

      document.body.classList.toggle("dark");

      const isDark =
        document.body.classList.contains("dark");

      localStorage.setItem(
        "darkMode",
        isDark ? "true" : "false"
      );

      updateDarkModeButton();
    });

    if (
      localStorage.getItem("darkMode") === "true"
    ) {
      document.body.classList.add("dark");
    }

    updateDarkModeButton();

    /* =========================
       START
    ========================= */

    renderTasks();

  </script>

</body>
</html>
